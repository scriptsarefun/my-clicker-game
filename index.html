<!DOCTYPE html>
<html>
<head>
    <title>My Upgraded Web Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding-top: 30px;
        }
        .game-box {
            background-color: white;
            width: 340px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }
        .shop-box {
            background-color: #f1f2f6;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        button:active {
            transform: scale(0.98);
        }
        .shop-btn {
            background-color: #2ed573;
            font-size: 14px;
            padding: 8px;
        }
        input {
            margin-top: 15px;
            padding: 5px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="game-box" id="box">
        <h1>Super Clicker!</h1>
        <h2 id="score-text">Score: 0</h2>
        <p id="stats-text">Click Power: +1 | Auto-Bots: 0</p>
        
        <button onclick="addPoint()">CLICK ME!</button>
        
        <!-- THE UPGRADE SHOP -->
        <div class="shop-box">
            <h3>🛒 Upgrade Shop</h3>
            <button class="shop-btn" id="upgrade-click-btn" onclick="buyClickUpgrade()">
                +2 Click Power (Cost: 15)
            </button>
            <button class="shop-btn" id="upgrade-bot-btn" onclick="buyBotUpgrade()">
                Buy Auto-Bot (Cost: 30)
            </button>
        </div>

        <p>Got a cheat code?</p>
        <input type="text" id="code-input" placeholder="Enter code..." oninput="checkCode()">
    </div>

    <script>
        let score = 0;
        let pointsPerClick = 1;
        
        let clickUpgradeCost = 15;
        
        let autoBots = 0;
        let botCost = 30;

        // 🔊 Safe Sound Engine
        function makeArcadeSound(pitch, length) {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let volume = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
                volume.gain.setValueAtTime(0.15, audioCtx.currentTime);
                volume.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + length);
                osc.connect(volume);
                volume.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + length);
            } catch(e) {}
        }

        // Update the screen text
        function updateScreen() {
            document.getElementById("score-text").innerText = "Score: " + score;
            document.getElementById("stats-text").innerText = "Click Power: +" + pointsPerClick + " | Auto-Bots: " + autoBots;
            document.getElementById("upgrade-click-btn").innerText = "+2 Click Power (Cost: " + clickUpgradeCost + ")";
            document.getElementById("upgrade-bot-btn").innerText = "Buy Auto-Bot (Cost: " + botCost + ")";
        }

        // Click the main button
        function addPoint() {
            score = score + pointsPerClick;
            makeArcadeSound(523, 0.08); // Normal click sound
            updateScreen();
        }

        // Upgrade Click Power
        function buyClickUpgrade() {
            if (score >= clickUpgradeCost) {
                score = score - clickUpgradeCost;
                pointsPerClick = pointsPerClick + 2;
                clickUpgradeCost = Math.round(clickUpgradeCost * 1.5); // Makes the next upgrade cost more!
                makeArcadeSound(880, 0.15); // Cha-ching purchase sound
                updateScreen();
            } else {
                alert("❌ Not enough points!");
            }
        }

        // Buy an Auto-Clicker Bot
        function buyBotUpgrade() {
            if (score >= botCost) {
                score = score - botCost;
                autoBots = autoBots + 1;
                botCost = Math.round(botCost * 1.5); // Makes the next bot cost more!
                makeArcadeSound(880, 0.15); // Purchase sound
                updateScreen();
            } else {
                alert("❌ Not enough points!");
            }
        }

        // 🤖 AUTO-CLICKER LOOP: This code runs every 1 second (1000 milliseconds)
        setInterval(function() {
            if (autoBots > 0) {
                score = score + autoBots;
                makeArcadeSound(350, 0.05); // Quiet low beep when bot clicks for you
                updateScreen();
            }
        }, 1000);

        // Secret Cheat Code
        function checkCode() {
            let typedText = document.getElementById("code-input").value;
            if (typedText === "999") {
                pointsPerClick = 100;
                score = score + 1000; // Gives you a massive pile of points instantly!
                
                makeArcadeSound(523, 0.15);
                setTimeout(() => makeArcadeSound(659, 0.15), 100);
                setTimeout(() => makeArcadeSound(784, 0.3), 200);

                document.body.style.backgroundColor = "#1e272e";
                document.getElementById("box").style.backgroundColor = "#3d3d3d";
                document.getElementById("box").style.color = "#00d2d3";
                alert("🔓 CHEAT UNLOCKED! +1,000 Points and Mega Click Power!");
                document.getElementById("code-input").value = ""; // Clears the box
                updateScreen();
            }
        }
    </script>

</body>
</html>
